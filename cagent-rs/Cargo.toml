[package]
name = "cagent"
version = "0.1.0"
edition = "2021"
authors = ["Docker Inc."]
description = "AI agent runner - port of cagent to Rust"
license = "Apache-2.0"
repository = "https://github.com/docker/cagent"

[dependencies]
# Async runtime
tokio = { version = "1.45", features = ["full"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["io"] }
futures = "0.3"
async-trait = "0.1"
async-stream = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# HTTP client for AI providers
reqwest = { version = "0.12", features = ["json", "stream"] }
reqwest-eventsource = "0.6"

# HTTP server for API
axum = { version = "0.8", features = ["json", "tokio"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# CLI
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.5"

# Logging & tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# OpenTelemetry
opentelemetry = "0.28"
opentelemetry_sdk = { version = "0.28", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.28", features = ["tonic", "grpc-tonic"] }
tracing-opentelemetry = "0.29"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Utilities
uuid = { version = "1.16", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1.11"
walkdir = "2.5"
ignore = "0.4"
glob = "0.3"
once_cell = "1.20"
lazy_static = "1.5"
tar = "0.4"
sha2 = "0.10"

# OCI registry client
oci-client = "0.16"

# SQLite for memory/session storage
rusqlite = { version = "0.34", features = ["bundled"] }

# Directory utilities
dirs = "6.0"

# TUI (optional, for interactive mode)
ratatui = { version = "0.29", optional = true }
crossterm = { version = "0.29", optional = true }
tui-textarea = { version = "0.7", optional = true }
arboard = { version = "3.4", optional = true }
syntect = { version = "5.2", optional = true, default-features = false, features = ["default-fancy"] }

# JSON Schema
schemars = "0.8"

# MCP (Model Context Protocol)
rust-mcp-sdk = { version = "0.8", default-features = false, features = ["client", "server", "stdio", "sse", "streamable-http", "hyper-server"] }
urlencoding = "2.1.3"
terminal_size = "0.4.3"
atty = "0.2.14"
parking_lot = "0.12.5"
rand = { version = "0.9.2", features = ["small_rng"] }

[features]
default = ["tui"]
tui = ["dep:ratatui", "dep:crossterm", "dep:tui-textarea", "dep:arboard", "dep:syntect"]

[dev-dependencies]
tempfile = "3.10"
criterion = "0.5"
rvcr = "0.2"
wiremock = "0.6"

[[bin]]
name = "cagent"
path = "src/main.rs"

[[bench]]
name = "bench"
harness = false

[profile.release]
lto = true
codegen-units = 1
strip = true
